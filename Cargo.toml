[package]
name = "md_viewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Markdown editor and viewer for macOS on Apple Silicon"

[dependencies]
eframe = { version = "0.37", features = ["clipboard", "default_fonts", "links", "system_fonts", "wgpu"], default-features = false }
egui_extras = { version = "0.37", features = ["file", "image", "svg_text"] }
env_logger = "0.11.11"
image = { version = "0.25", features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
latex-rust = { version = "3.0.1", default-features = false, features = ["std", "png"] }
log = "0.4.34"
mermaid-svg = "0.7"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
ammonia = "4"
rfd = "0.16"
winit = "0.30"
tl = "0.7.8"
encoding_rs = "0.8.35"
unicode-bidi = "0.3.18"
toml = "0.8.23"
serde_json = "1.0.145"

# macOS glue for Finder "Open With" events (see src/macos_open.rs) and the
# About panel credits (see src/macos_about.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSAttributedString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSAttributedString", "NSRange", "NSURL"] }
